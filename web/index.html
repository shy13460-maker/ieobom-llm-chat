<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이어봄 · 대화를 기억하는 AI</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><aside><div class="brand"><span class="mark">↗</span> 이어봄 <small>LOCAL AI LAB</small></div><button id="new" class="new">＋ 새 대화</button><div class="label">나의 대화</div><nav id="chats" aria-label="저장한 대화"></nav><div class="side-note"><span class="dot"></span> 이 대화는 자동 저장됩니다<p>채팅을 삭제해도 장기 기억은 남아요.<br>같은 브라우저로 이용해 주세요.</p></div></aside>
<main><header><div><strong id="title">새로운 이야기를 시작하세요</strong><span>Qwen3.5 9B · 오픈소스 LLM 실습</span></div><div id="health" class="pill">연결 확인 중</div></header>
<section id="messages" aria-live="polite"><div class="welcome"><div class="eyebrow">YOUR CONVERSATION, CONTINUED</div><h1>어제의 이야기를,<br><em>오늘도 이어서.</em></h1><p>질문하고, 함께 생각하고, 다음에 다시 이어가세요.<br>이 컴퓨터에서 실행되는 AI가 답합니다.</p><div class="suggestions"><button data-prompt="안녕! 너는 어떤 도움을 줄 수 있어?">가볍게 인사하기 <b>↗</b></button><button data-prompt="내 프로젝트 이름은 파란등대야. 기억해 줘.">대화 기억 테스트 <b>↗</b></button><button data-prompt="오픈소스 LLM이 무엇인지 세 문장으로 설명해 줘.">LLM 알아보기 <b>↗</b></button></div></div></section>
<div class="bottom"><div id="notice" role="status"></div><form id="form"><textarea id="input" rows="1" maxlength="1500" placeholder="메시지를 입력하세요. 이전 이야기도 이어서 물어보세요." aria-label="메시지"></textarea><button id="send" type="submit" aria-label="메시지 보내기">↑</button></form><div class="fine">Enter 전송 · Shift+Enter 줄바꿈 <span>AI 답변은 틀릴 수 있습니다. 대화는 운영자 컴퓨터에 저장됩니다.</span></div></div></main></body></html>
